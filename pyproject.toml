[project]
name = "assistant-service"
version = "0.1.0"
description = "Реестр AI-ассистентов и запуск flow (обёртка над Langflow) для платформы Mosaix"
authors = [
    {name = "kuznecov.pavel66", email = "kuznecov.pavel66@rwb.ru"}
]
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi (>=0.115,<1.0)",
    "uvicorn[standard] (>=0.32,<1.0)",
    "pydantic (>=2.9,<3.0)",
    "pydantic-settings (>=2.6,<3.0)",
    "sqlalchemy[asyncio] (>=2.0,<3.0)",
    "asyncpg (>=0.30,<1.0)",
    "alembic (>=1.14,<2.0)",
    "httpx (>=0.28,<1.0)",
    "python-json-logger (>=2.0,<3.0)",
    "greenlet (>=3.5.5,<4.0.0)",
]

[tool.poetry]
packages = [{include = "app"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
pytest-cov = "^6.0"
respx = "^0.22"
aiosqlite = "^0.20"
ruff = "^0.13"
mypy = "^1.13"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# E501: длину строки контролирует форматтер
# N818: разрешаем краткие имена исключений без суффикса Error (AssistantNotFound и т.п.)
ignore = ["E501", "N818"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.mypy]
python_version = "3.14"
strict = true
exclude = ["alembic/", "tests/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["system: end-to-end tests against a live local Langflow"]
addopts = "-ra"
